# CI (#48 + #49) — runs on every push/PR.
#
# Three jobs:
#   frontend  — install, vulnerability audit, lesson lint, production build
#   backend   — compile + unit tests (hard gate) + vulnerability audit per service
#   secrets   — scan the diff for accidentally committed credentials
#
# High-severity vulnerabilities fail the build, so a vulnerable dependency
# cannot merge unnoticed. Audits are scoped to runtime deps where it matters.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fail only on high/critical vulnerabilities (audit prod deps).
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint lessons
        run: npm run lint:lessons
      # Five guards that existed but were never run on push: price agreement
      # across the three files that publish it, API route coverage, achievement
      # durability, curriculum parity and fallback, and lesson solvability.
      # A guard nobody runs is a comment.
      - name: Guards
        run: npm run check
      - name: Production build
        run: npm run build

  # The phone app was not in CI at all: 21 check scripts and the typecheck ran
  # only on a developer's machine. Every guard written to stop a mobile
  # regression was therefore unenforced on push, which is most of the value of
  # having written them.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # NOT `npm audit --audit-level=high` like the frontend job. Vite is a
      # devDependency there so --omit=dev removes it; in an Expo app `expo` is a
      # runtime dependency by necessity and drags @expo/cli and metro in with it.
      # Every high advisory today is in that build toolchain, which never reaches
      # a device. This gate fails on any critical, and on any high OUTSIDE a named
      # build-toolchain list, so a real one in shipped code still stops the build.
      - name: Vulnerability gate
        run: node scripts/check-audit.mjs
      # Typecheck plus every scripts/check-*.mjs. The checks read the served
      # curriculum from backend/live-bridge/app/curriculum_data and some read the
      # web source, so this job needs the whole checkout, not just mobile/.
      - name: Checks
        run: npm run check

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [live-bridge, quiz-engine, vision-verifier, compiler, reporter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install + tooling
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f backend/${{ matrix.service }}/requirements.txt ]; then
            pip install -r backend/${{ matrix.service }}/requirements.txt
          fi
      - name: Compile
        run: |
          python -m compileall -q backend/${{ matrix.service }}/app
      # Hard gate: unit tests must pass. Services without a tests/ dir are skipped.
      - name: Tests
        run: |
          if [ -d backend/${{ matrix.service }}/tests ]; then
            if [ -f backend/${{ matrix.service }}/requirements-dev.txt ]; then
              pip install -r backend/${{ matrix.service }}/requirements-dev.txt
            else
              pip install pytest
            fi
            cd backend/${{ matrix.service }} && python -m pytest
          else
            echo "No tests/ for ${{ matrix.service }} — skipping."
          fi
      # Reports known CVEs in the dependency tree. Surfaced for triage rather
      # than hard-blocking: pip-audit has no severity filter, and the google-adk
      # tree carries transitive advisories we cannot all patch immediately.
      # Flip to a hard gate once the tree is clean.
      - name: pip-audit (vulnerability scan)
        continue-on-error: true
        run: |
          if [ -f backend/${{ matrix.service }}/requirements.txt ]; then
            pip-audit -r backend/${{ matrix.service }}/requirements.txt
          fi

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the PR's commits to scope its scan, which needs
    # pull-requests: read. The workflow-level grant is contents: read only, and a
    # Dependabot PR runs with a restricted token, so on those the API call came
    # back 403 "Resource not accessible by integration" and the whole job failed.
    # Every Dependabot PR mailed a CI failure that had nothing to do with secrets.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
